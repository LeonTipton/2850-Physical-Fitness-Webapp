<!DOCTYPE html>
<html lang="en">    

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Page</title>
  <link rel="stylesheet" href="pages/css/welcome_page.css">
  <style>
    .settings-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: white;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      color: #333;
    }

    .settings-btn:hover {
      background: #f5f5f5;
    }

    body {
      position: relative;
    }
  </style>
</head>

<body>
  <a href="pages/setting_page.html" class="settings-btn" aria-label="Settings">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
    </svg>
  </a>

  <div class="card">
    <div class="logo">LOGO</div>

    <p class="intro">
      <span data-i18n="indp_intro_1">Welcome to our fitness and training app.<br></span>
      <span data-i18n="indp_intro_2">We are here to help you stay healthy.</span>
    </p>

    <a href="pages/login_page.html" class="btn" data-i18n="indp_log_btn">Login</a>
    <a href="pages/register_page.html" class="btn" data-i18n="indp_regis_btn">Register</a>
  </div>

  <!-- Language Change Script --> 
  <script src="pages/js/i18n.js"></script>
</body>

</html>
