<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run Activity - Fitness App</title>
  <link rel="stylesheet" href="css/run_page.css">
  <link rel="icon" type="image/png" size="32x32" href="../logo/favicon-32.png">
</head>

<body>
  <div class="page-bg"></div>
  <div class="page-overlay"></div>

  <nav class="top-nav">
    <a href="start_page.html" class="nav-back">
      <svg class="nav-back-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span data-i18n="back">Back</span>
    </a>
    
    <a href="home_page.html" class="nav-logo">
      <img src="../logo/white.png" alt="Fitness App Logo">
    </a>

    <div class="nav-right">
      <a href="setting_page.html" class="nav-icon" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </a>
      <a href="profile_page.html" class="nav-icon" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
      </a>
    </div>
  </nav>

  <main class="run-main">
    <!-- Page Header -->
    <header class="run-header card-animate">
      <h1 class="run-title" data-i18n="runp_title">Run Activity</h1>
      <p class="run-subtitle" data-i18n="runp_subtitle">Track your runs and progress</p>
    </header>

    <div class="run-layout">
      <!-- Main Form -->
      <section class="run-form-card card-animate">
        <div class="form-header">
          <h2 class="form-title" data-i18n="runp_car_title">New Run</h2>
          <div class="run-goal">
            <span class="goal-label" data-i18n="runp_t_w">This week</span>
            <span class="goal-value">18 km / 30 km</span>
            <div class="goal-bar"><div class="goal-fill" style="width: 60%"></div></div>
          </div>
        </div>
        <!-- Live Timer (hidden in idle state) -->
        <div id="timer-display" class="timer-display hidden">
          <div id="timer-status" class="timer-status">Running</div>
          <div id="timer-clock" class="timer-clock">00:00</div>
        </div>

        <form class="run-form">
          <div class="form-row">
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span><span data-i18n="runp_distance">Distance (km)</span></label>
              <input id="run-distance" type="number" step="0.1" min="0" placeholder="0.0">
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span><span data-i18n="runp_duration">Duration (min)</span></label>
              <input id="run-duration" type="number" min="0" placeholder="0" readonly>
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span><span data-i18n="runp_c_b">Calories burned</span></label>
              <input type="number" min="0" placeholder="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M4 8l4 4 4-4 4 4M4 16l4 4 4-4 4 4"/></svg></span><span data-i18n="runp_steps">Steps</span></label>
              <input type="number" min="0" placeholder="0">
            </div>
            <div class="form-group">
              <label data-i18n="runp_avg_pace">Avg. pace (min/km)</label>
              <input id="run-pace" type="text" readonly placeholder="--:--">
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span><span data-i18n="runp_location">Location</span></label>
              <input type="text" data-i18n-placeholder="runp_loca_placeholder" placeholder="Park or route name">
            </div>
          </div>
          <div class="form-row form-row-2">
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span><span data-i18n="runp_weather">Weather</span></label>
              <select>
                <option value="" data-i18n="runp_s_w">Select weather</option>
                <option data-i18n="runp_sunny">Sunny</option>
                <option data-i18n="runp_cloudy">Cloudy</option>
                <option data-i18n="runp_rainy">Rainy</option>
                <option data-i18n="runp_sonwy">Snowy</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="runp_notes">Notes</label>
            <textarea rows="3" data-i18n-placeholder="runp_notes_placeholder" placeholder="Add notes about your run..."></textarea>
          </div>
        </form>

        <!-- Action Buttons -->
        <div class="run-actions">
          <button id="btn-start"  class="btn-primary" data-i18n="runp_start_r">Start Run</button>
          <button id="btn-pause"  class="btn-secondary" disabled data-i18n="runp_pause">Pause</button>
          <button id="btn-finish" class="btn-secondary" disabled data-i18n="runp_finish">Finish</button>
          <button id="btn-save"   class="btn-outline"   disabled data-i18n="runp_save_r">Save Run</button>
        </div>
      </section>

      <!-- Sidebar -->
      <aside class="run-sidebar">
        <!-- Summary Card -->
        <div class="summary-card card-animate card-animate-delay-1">
          <h3 class="summary-title" data-i18n="runp_y_s">Your Stats</h3>
          <div class="summary-grid">
            <div class="summary-item summary-item-1">
              <span class="summary-value" id="stat-total-runs">—</span>
              <span class="summary-label" data-i18n="runp_total_r">Total Runs</span>
            </div>
            <div class="summary-item summary-item-2">
              <span class="summary-value" id="stat-total-distance">—</span>
              <span class="summary-label" data-i18n="runp_total_dis">Total Distance</span>
            </div>
            <div class="summary-item summary-item-3">
              <span class="summary-value" id="stat-avg-pace">—</span>
              <span class="summary-label" data-i18n="runp_aveg_pace">Avg Pace (min/km)</span>
            </div>
            <div class="summary-item summary-item-4">
              <span class="summary-value" id="stat-longest">—</span>
              <span class="summary-label" data-i18n="runp_longest_r">Longest Run</span>
            </div>
          </div>
        </div>

        <!-- Recent Runs -->
        <div class="recent-card card-animate card-animate-delay-2">
          <h3 class="recent-title" data-i18n="runp_recent_rs">Recent Runs</h3>
          <ul class="recent-list" id="recent-list">
            <li class="recent-empty">No runs saved yet.</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>
  <!-- Save success notification -->
  <div id="save-notification" class="save-notif" role="status" aria-live="polite">
    <span class="save-notif-icon">✓</span>
    <div>
      <div class="save-notif-title">Run Saved!</div>
      <div class="save-notif-sub">
        <span>Record stored.</span>
        <a href="records_page.html">View Records →</a>
      </div>
    </div>
  </div>

  <script src="js/activity-store.js"></script>
  <script>
  (function () {
    var btnStart    = document.getElementById('btn-start');
    var btnPause    = document.getElementById('btn-pause');
    var btnFinish   = document.getElementById('btn-finish');
    var btnSave     = document.getElementById('btn-save');
    var timerDisplay = document.getElementById('timer-display');
    var timerClock  = document.getElementById('timer-clock');
    var timerStatus = document.getElementById('timer-status');
    var saveNotif   = document.getElementById('save-notification');

    var distanceInput = document.getElementById('run-distance');
    var durationInput = document.getElementById('run-duration');
    var paceInput     = document.getElementById('run-pace');
    var notesArea     = document.querySelector('.run-form textarea');
    var weatherSelect = document.querySelector('.run-form select');
    var caloriesInput = document.querySelector('.run-form .form-row .form-group:nth-child(3) input');
    var stepsInput    = document.querySelector('.run-form .form-row:nth-child(2) .form-group:first-child input');
    var locationInput = document.querySelector('.run-form input[type="text"][placeholder="Park or route name"]');

    var state          = 'idle';
    var timerInterval  = null;
    var elapsedSeconds = 0;
    var startTimestamp = null;
    var startDate      = null;

    function pad(n) { return String(n).padStart(2, '0'); }

    function formatClock(s) {
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      return h > 0
        ? pad(h) + ':' + pad(m) + ':' + pad(sec)
        : pad(m) + ':' + pad(sec);
    }

    function formatDuration(s) {
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      if (h > 0) return h + ' h ' + m + ' min';
      return (m || 1) + ' min';
    }

    function updateTimerDisplay() {
      timerClock.textContent = formatClock(elapsedSeconds);
      var mins = Math.round(elapsedSeconds / 60);
      if (mins >= 1) durationInput.value = mins;
      updatePace();
    }

    function tickTimer() {
      elapsedSeconds = Math.floor((Date.now() - startTimestamp) / 1000);
      updateTimerDisplay();
    }

    function startTicking() {
      startTimestamp = Date.now() - elapsedSeconds * 1000;
      timerInterval  = setInterval(tickTimer, 1000);
    }

    function stopTicking() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function updatePace() {
      var dist = parseFloat(distanceInput.value);
      var mins = elapsedSeconds > 0
        ? elapsedSeconds / 60
        : parseFloat(durationInput.value);
      if (!dist || !mins || dist <= 0 || mins <= 0) {
        paceInput.value = '';
        return;
      }
      var paceMin = mins / dist;
      var totalSec = Math.round(paceMin * 60);
      paceInput.value = Math.floor(totalSec / 60) + ':' + pad(totalSec % 60);
    }

    distanceInput.addEventListener('input', updatePace);

    function setState(newState) {
      state = newState;

      timerDisplay.classList.toggle('hidden', state === 'idle');
      timerDisplay.classList.toggle('timer-running',  state === 'running');
      timerDisplay.classList.toggle('timer-paused',   state === 'paused');
      timerDisplay.classList.toggle('timer-finished', state === 'finished');

      switch (state) {
        case 'idle':
          btnStart.textContent = 'Start Run';
          btnStart.disabled  = false;
          btnPause.disabled  = true;
          btnFinish.disabled = true;
          btnSave.disabled   = true;
          timerStatus.textContent = '';
          elapsedSeconds = 0;
          durationInput.value = '';
          timerClock.textContent = '00:00';
          break;

        case 'running':
          btnStart.textContent = 'Running…';
          btnStart.disabled  = true;
          btnPause.textContent = 'Pause';
          btnPause.disabled  = false;
          btnFinish.disabled = false;
          btnSave.disabled   = true;
          timerStatus.textContent = 'Running';
          break;

        case 'paused':
          btnStart.textContent = 'Resume';
          btnStart.disabled  = false;
          btnPause.disabled  = true;
          btnFinish.disabled = false;
          btnSave.disabled   = true;
          timerStatus.textContent = 'Paused';
          break;

        case 'finished':
          btnStart.textContent = 'Start Run';
          btnStart.disabled  = true;
          btnPause.disabled  = true;
          btnFinish.disabled = true;
          btnSave.disabled   = false;
          btnSave.textContent = 'Save Run';
          timerStatus.textContent = 'Finished';
          break;
      }
    }

    btnStart.addEventListener('click', function (e) {
      e.preventDefault();
      if (state === 'idle') {
        startDate = new Date();
        startTicking();
        setState('running');
      } else if (state === 'paused') {
        startTicking();
        setState('running');
      }
    });

    btnPause.addEventListener('click', function (e) {
      e.preventDefault();
      if (state === 'running') {
        stopTicking();
        setState('paused');
      }
    });

    btnFinish.addEventListener('click', function (e) {
      e.preventDefault();
      stopTicking();
      setState('finished');
      updateTimerDisplay();
    });

    btnSave.addEventListener('click', function (e) {
      e.preventDefault();
      saveRun();
    });

    function saveRun() {
      var distance = parseFloat(distanceInput.value) || 0;
      var calories = parseInt(caloriesInput ? caloriesInput.value : '', 10) || 0;
      var location = (locationInput ? locationInput.value : '').trim() || 'Run';

      var dateObj       = startDate || new Date();
      var dateFormatted = dateObj.toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric'
      });
      var dateISO = dateObj.toISOString().slice(0, 10);

      var details = [];
      if (distance > 0) details.push({ icon: 'distance', text: distance.toFixed(1) + ' km' });
      if (calories > 0) details.push({ icon: 'cal',      text: calories + ' kcal' });
      if (details.length === 0) details.push({ icon: 'distance', text: '—' });

      var record = {
        id:              String(Date.now()),
        type:            'run',
        label:           'Run',
        emoji:           '🏃',
        date:            dateFormatted,
        dateISO:         dateISO,
        duration:        formatDuration(elapsedSeconds),
        durationSeconds: elapsedSeconds,
        badge:           location,
        details:         details,
        distanceKm:      distance,
        calories:        calories,
        location:        location,
        weather:         weatherSelect ? weatherSelect.value : '',
        notes:           notesArea ? notesArea.value.trim() : ''
      };

      ActivityStore.add(record);
      refreshSidebar();
      showNotification();
    }

    function showNotification() {
      saveNotif.classList.add('save-notif--visible');
      setTimeout(function () {
        saveNotif.classList.remove('save-notif--visible');
        resetForm();
      }, 3000);
    }

    function resetForm() {
      stopTicking();
      setState('idle');
      distanceInput.value = '';
      paceInput.value     = '';
      if (caloriesInput) caloriesInput.value = '';
      if (stepsInput)    stepsInput.value    = '';
      if (locationInput) locationInput.value = '';
      if (notesArea)     notesArea.value     = '';
      if (weatherSelect) weatherSelect.value = '';
      startDate = null;
    }

    function refreshSidebar() {
      var runs = ActivityStore.getAll().filter(function (r) {
        return r.type === 'run';
      });

      var totalCount   = runs.length;
      var totalDistKm  = runs.reduce(function (s, r) { return s + (r.distanceKm || 0); }, 0);
      var longestDist  = runs.reduce(function (s, r) { return Math.max(s, r.distanceKm || 0); }, 0);

      var totalSecs = runs.reduce(function (s, r) { return s + (r.durationSeconds || 0); }, 0);
      var avgPace = '';
      if (totalDistKm > 0 && totalSecs > 0) {
        var paceMin  = (totalSecs / 60) / totalDistKm;
        var paceSec  = Math.round(paceMin * 60);
        avgPace = Math.floor(paceSec / 60) + ':' + pad(paceSec % 60);
      }

      document.getElementById('stat-total-runs').textContent =
        totalCount > 0 ? totalCount : '—';
      document.getElementById('stat-total-distance').textContent =
        totalDistKm > 0 ? totalDistKm.toFixed(1) + ' km' : '—';
      document.getElementById('stat-avg-pace').textContent =
        avgPace || '—';
      document.getElementById('stat-longest').textContent =
        longestDist > 0 ? longestDist.toFixed(1) + ' km' : '—';

      var list = document.getElementById('recent-list');
      if (runs.length === 0) {
        list.innerHTML = '<li class="recent-empty">No runs saved yet.</li>';
        return;
      }

      list.innerHTML = runs.slice(0, 5).map(function (r) {
        return '<li class="recent-item">'
          + '<div class="recent-info">'
          +   '<span class="recent-location">' + escHtml(r.badge) + '</span>'
          +   '<span class="recent-date">'     + escHtml(r.date)  + '</span>'
          + '</div>'
          + '<span class="recent-distance">'
          +   (r.distanceKm > 0 ? r.distanceKm.toFixed(1) + ' km' : r.duration)
          + '</span>'
          + '</li>';
      }).join('');
    }

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    refreshSidebar();
    setState('idle');
  })();
  </script>

  <!-- Language Change Script --> 
  <script src="js/i18n.js"></script>
</body>

</html>
