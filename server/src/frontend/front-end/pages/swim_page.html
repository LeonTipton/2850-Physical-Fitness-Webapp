<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swim Activity - Fitness App</title>
  <link rel="stylesheet" href="css/swim_page.css">
  <link rel="icon" type="image/png" size="32x32" href="../logo/favicon-32.png">
</head>

<body>
  <div class="page-bg"></div>
  <div class="page-overlay"></div>

  <nav class="top-nav">
    <a href="start_page.html" class="nav-back">
      <svg class="nav-back-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span data-i18n="back">Back</span>
    </a>
    <a href="home_page.html" class="nav-logo">
      <img src="../logo/white.png" alt="Fitness App Logo">
    </a>
    <div class="nav-right">
      <a href="setting_page.html" class="nav-icon" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </a>
      <a href="profile_page.html" class="nav-icon" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
      </a>
    </div>
  </nav>

  <main class="swim-main">
    <!-- Page Header -->
    <header class="swim-header card-animate">
      <h1 class="swim-title" data-i18n="swim_title">Swim Activity</h1>
      <p class="swim-subtitle" data-i18n="swim_subtitle">Track your swimming and progress</p>
    </header>

    <div class="swim-layout">
      <!-- Main Form -->
      <section class="swim-form-card card-animate">
        <div class="form-header">
          <h2 class="form-title" data-i18n="new_swim">New Swim</h2>
          <div class="swim-goal">
            <span class="goal-label" data-i18n="this_week">This week</span>
            <span class="goal-value">2.5 km / 4 km</span>
            <div class="goal-bar"><div class="goal-fill" style="width: 62%"></div></div>
          </div>
        </div>
        <div id="timer-display" class="timer-display hidden">
          <div id="timer-status" class="timer-status">Running</div>
          <div id="timer-clock" class="timer-clock">00:00</div>
        </div>
        <form class="swim-form">
          <div class="form-row">
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span><span data-i18n="distance">Distance (m)</span></label>
              <input id="swim-distance" type="number" min="0" placeholder="0">
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span><span data-i18n="duration">Duration (min)</span></label>
              <input id="swim-duration" type="number" min="0" placeholder="0" readonly>
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span><span data-i18n="calories_burned">Calories burned</span></label>
              <input type="number" min="0" placeholder="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M4 8l4 4 4-4 4 4M4 16l4 4 4-4 4 4"/></svg></span><span data-i18n="laps">Laps</span></label>
              <input type="number" min="0" placeholder="0">
            </div>
            <div class="form-group">
              <label data-i18n="pool_length">Pool Length (m)</label>
              <select id="pool-length">
                <option value="" data-i18n="select_length">Select length</option>
                <option value="25">25 m</option>
                <option value="50">50 m</option>
                <option value="33">33 m</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="avg_pace">Avg. pace (min/100m)</label>
              <input id="swim-pace" type="text" readonly placeholder="--:--">
            </div>
          </div>
          <div class="form-row form-row-2">
            <div class="form-group">
              <label data-i18n="stroke_type">Stroke Type</label>
              <select>
                <option value="" data-i18n="select_stroke">Select stroke</option>
                <option data-i18n="freestyle">Freestyle</option>
                <option data-i18n="backstroke">Backstroke</option>
                <option data-i18n="breaststroke">Breaststroke</option>
                <option data-i18n="butterfly">Butterfly</option>
                <option data-i18n="individual_medley">Individual Medley</option>
              </select>
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span><span data-i18n="location">Location</span></label>
              <input type="text" data-i18n-placeholder="loaction_placeholder" placeholder="Pool or facility name">
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="notes">Notes</label>
            <textarea rows="3" data-i18n-placeholder="swim_notes_placeholder" placeholder="Add notes about your swim..."></textarea>
          </div>
        </form>

        <!-- Action Buttons -->
        <div class="swim-actions">
          <button id="btn-start" class="btn-primary" data-i18n="start_swim">Start Swim</button>
          <button id="btn-pause" class="btn-secondary" data-i18n="pause">Pause</button>
          <button id="btn-finish" class="btn-secondary" data-i18n="finish">Finish</button>
          <button id="btn-save" class="btn-outline" data-i18n="save_swim">Save Swim</button>
        </div>
      </section>

      <!-- Sidebar -->
      <aside class="swim-sidebar">
        <!-- Summary Card -->
        <div class="summary-card card-animate card-animate-delay-1">
          <h3 class="summary-title" data-i18n="your_stats">Your Stats</h3>
          <div class="summary-grid">
            <div class="summary-item summary-item-1">
              <span id="stat-total-swims" class="summary-value">&mdash;</span>
              <span class="summary-label" data-i18n="total_swim">Total Swims</span>
            </div>
            <div class="summary-item summary-item-2">
              <span id="stat-total-distance" class="summary-value">&mdash;</span>
              <span class="summary-label" data-i18n="total_distance">Total Distance</span>
            </div>
            <div class="summary-item summary-item-3">
              <span id="stat-avg-pace" class="summary-value">&mdash;</span>
              <span class="summary-label" data-i18n="avgpace">Avg Pace (min/100m)</span>
            </div>
            <div class="summary-item summary-item-4">
              <span id="stat-longest" class="summary-value">&mdash;</span>
              <span class="summary-label" data-i18n="longest_swim">Longest Swim</span>
            </div>
          </div>
        </div>

        <!-- Recent Swims -->
        <div class="recent-card card-animate card-animate-delay-2">
          <h3 class="recent-title" data-i18n="recent_swim">Recent Swims</h3>
          <ul id="recent-list" class="recent-list">
            <li class="recent-empty">No swims saved yet.</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>
  <div id="save-notification" class="save-notif" role="status" aria-live="polite">
    <span class="save-notif-icon">✓</span>
    <div>
      <div class="save-notif-title">Swim Saved!</div>
      <div class="save-notif-sub">
        <span>Record stored.</span>
        <a href="records_page.html">View Records →</a>
      </div>
    </div>
  </div>

  <script src="js/activity-store.js"></script>
  <script>
    (function () {
      var distanceInput = document.getElementById('swim-distance');
      var durationInput = document.getElementById('swim-duration');
      var paceInput = document.getElementById('swim-pace');
      var timerDisplay = document.getElementById('timer-display');
      var timerStatus = document.getElementById('timer-status');
      var timerClock = document.getElementById('timer-clock');
      var btnStart = document.getElementById('btn-start');
      var btnPause = document.getElementById('btn-pause');
      var btnFinish = document.getElementById('btn-finish');
      var btnSave = document.getElementById('btn-save');
      var notification = document.getElementById('save-notification');

      var state = 'idle';
      var startTime = 0;
      var elapsed = 0;
      var tickInterval = null;

      function pad(n) {
        return n < 10 ? '0' + n : '' + n;
      }

      function formatClock(ms) {
        var totalSec = Math.floor(ms / 1000);
        var m = Math.floor(totalSec / 60);
        var s = totalSec % 60;
        return pad(m) + ':' + pad(s);
      }

      function formatDuration(ms) {
        var totalSec = Math.floor(ms / 1000);
        var h = Math.floor(totalSec / 3600);
        var m = Math.floor((totalSec % 3600) / 60);
        var s = totalSec % 60;
        if (h > 0) return h + 'h ' + pad(m) + 'm ' + pad(s) + 's';
        if (m > 0) return m + 'm ' + pad(s) + 's';
        return s + 's';
      }

      function startTicking() {
        stopTicking();
        tickInterval = setInterval(function () {
          var now = Date.now();
          var total = elapsed + (now - startTime);
          timerClock.textContent = formatClock(total);
          durationInput.value = (total / 60000).toFixed(2);
          updatePace();
        }, 250);
      }

      function stopTicking() {
        if (tickInterval) {
          clearInterval(tickInterval);
          tickInterval = null;
        }
      }

      function updatePace() {
        var distance = parseFloat(distanceInput.value);
        var duration = parseFloat(durationInput.value);
        if (!distance || !duration || distance <= 0 || duration <= 0) {
          paceInput.value = '';
          return;
        }
        var pacePer100m = duration / (distance / 100);
        var totalSeconds = Math.round(pacePer100m * 60);
        var mm = Math.floor(totalSeconds / 60);
        var ss = totalSeconds % 60;
        paceInput.value = mm + ':' + String(ss).padStart(2, '0');
      }

      function setState(s) {
        state = s;
        btnStart.disabled = true;
        btnPause.disabled = true;
        btnFinish.disabled = true;
        btnSave.disabled = true;

        if (s === 'idle') {
          btnStart.disabled = false;
          timerDisplay.classList.add('hidden');
        } else if (s === 'running') {
          btnPause.disabled = false;
          btnFinish.disabled = false;
          timerDisplay.classList.remove('hidden');
          timerStatus.textContent = 'Running';
        } else if (s === 'paused') {
          btnStart.disabled = false;
          btnFinish.disabled = false;
          timerDisplay.classList.remove('hidden');
          timerStatus.textContent = 'Paused';
        } else if (s === 'finished') {
          btnSave.disabled = false;
          timerDisplay.classList.remove('hidden');
          timerStatus.textContent = 'Finished';
        }
      }

      btnStart.addEventListener('click', function (e) {
        e.preventDefault();
        if (state === 'idle' || state === 'paused') {
          startTime = Date.now();
          setState('running');
          startTicking();
        }
      });

      btnPause.addEventListener('click', function (e) {
        e.preventDefault();
        if (state === 'running') {
          elapsed += Date.now() - startTime;
          stopTicking();
          setState('paused');
        }
      });

      btnFinish.addEventListener('click', function (e) {
        e.preventDefault();
        if (state === 'running') {
          elapsed += Date.now() - startTime;
          stopTicking();
        }
        if (state === 'running' || state === 'paused') {
          setState('finished');
        }
      });

      btnSave.addEventListener('click', function (e) {
        e.preventDefault();
        if (state === 'finished') {
          saveSwim();
        }
      });

      distanceInput.addEventListener('input', updatePace);

      function saveSwim() {
        var distanceM = parseFloat(distanceInput.value) || 0;
        var distanceKm = distanceM / 1000;
        var durationMs = elapsed;
        var durationMin = parseFloat(durationInput.value) || 0;
        var laps = parseInt(document.querySelector('input[placeholder="0"][min="0"]:not(#swim-distance):not(#swim-duration):not([readonly])').value) || 0;
        var lapsInput = document.querySelectorAll('.form-group input[type="number"]')[3];
        if (lapsInput) laps = parseInt(lapsInput.value) || 0;
        var strokeSelect = document.querySelectorAll('select')[1];
        var stroke = strokeSelect ? strokeSelect.value : '';
        var locationInput = document.querySelector('input[type="text"]:not(#swim-pace)');
        var location = locationInput ? locationInput.value : '';
        var notesEl = document.querySelector('textarea');
        var notes = notesEl ? notesEl.value : '';
        var pace = paceInput.value || '';

        var record = {
          type: 'swim',
          emoji: '🏊',
          date: new Date().toISOString(),
          distanceM: distanceM,
          distanceKm: Math.round(distanceKm * 100) / 100,
          durationMs: durationMs,
          duration: formatDuration(durationMs),
          durationMin: Math.round(durationMin * 100) / 100,
          pace: pace,
          stroke: stroke,
          location: location,
          notes: notes,
          details: distanceM + ' m' + (laps ? ' · ' + laps + ' laps' : '')
        };

        if (typeof ActivityStore !== 'undefined') {
          ActivityStore.add(record);
        }

        showNotification();
        refreshSidebar();
        resetForm();
      }

      function showNotification() {
        notification.classList.add('show');
        setTimeout(function () {
          notification.classList.remove('show');
        }, 3000);
      }

      function resetForm() {
        elapsed = 0;
        startTime = 0;
        distanceInput.value = '';
        durationInput.value = '';
        paceInput.value = '';
        var form = document.querySelector('.swim-form');
        if (form) form.reset();
        setState('idle');
        timerClock.textContent = '00:00';
      }

      function refreshSidebar() {
        var swims = [];
        if (typeof ActivityStore !== 'undefined') {
          var all = ActivityStore.getAll();
          for (var i = 0; i < all.length; i++) {
            if (all[i].type === 'swim') swims.push(all[i]);
          }
        }

        var totalEl = document.getElementById('stat-total-swims');
        var distEl = document.getElementById('stat-total-distance');
        var paceEl = document.getElementById('stat-avg-pace');
        var longestEl = document.getElementById('stat-longest');
        var recentList = document.getElementById('recent-list');

        if (swims.length === 0) {
          if (totalEl) totalEl.textContent = '\u2014';
          if (distEl) distEl.textContent = '\u2014';
          if (paceEl) paceEl.textContent = '\u2014';
          if (longestEl) longestEl.textContent = '\u2014';
          if (recentList) recentList.innerHTML = '<li class="recent-empty">No swims saved yet.</li>';
          return;
        }

        var totalDist = 0;
        var totalDurMin = 0;
        var longest = 0;
        for (var i = 0; i < swims.length; i++) {
          var d = swims[i].distanceM || 0;
          totalDist += d;
          totalDurMin += swims[i].durationMin || 0;
          if (d > longest) longest = d;
        }

        if (totalEl) totalEl.textContent = swims.length;
        if (distEl) distEl.textContent = (totalDist / 1000).toFixed(1) + ' km';
        if (paceEl) {
          if (totalDist > 0 && totalDurMin > 0) {
            var avgPace = totalDurMin / (totalDist / 100);
            var ts = Math.round(avgPace * 60);
            var am = Math.floor(ts / 60);
            var as = ts % 60;
            paceEl.textContent = am + ':' + pad(as);
          } else {
            paceEl.textContent = '\u2014';
          }
        }
        if (longestEl) longestEl.textContent = (longest / 1000).toFixed(1) + ' km';

        if (recentList) {
          var html = '';
          var show = swims.slice(-4).reverse();
          for (var j = 0; j < show.length; j++) {
            var s = show[j];
            var dateStr = new Date(s.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            html += '<li class="recent-item">' +
              '<div class="recent-info">' +
              '<span class="recent-location">' + (s.location || 'Swim') + '</span>' +
              '<span class="recent-date">' + dateStr + '</span>' +
              '</div>' +
              '<span class="recent-distance">' + (s.distanceKm || 0) + ' km</span>' +
              '</li>';
          }
          recentList.innerHTML = html;
        }
      }

      refreshSidebar();
      setState('idle');
    })();
  </script>

  <!-- Language Change Script -->
  <script src="js/i18n.js"></script>
</body>

</html>
