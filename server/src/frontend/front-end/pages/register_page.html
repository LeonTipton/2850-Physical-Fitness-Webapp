<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Page</title>
  <link rel="stylesheet" href="css/register_page.css">
  <link rel="icon" type="image/png" size="32x32" href="../logo/favicon-32.png">
</head>


<body>
    <a href="../index.html" class="back-home" data-i18n="regp_back_btn">← Back to Home</a>
    <div class="card">
        <div class="card-header">
            <a href="../index.html" class="logo-link">
                <img src="../logo/white.png" alt="Fitness App Logo">
            </a>
            <div class="text-header" data-i18n="regp_title">Register</div>
        </div>

        <div class="card-body">
            <form action="#">
                <div class="form-group">
                    <label for="username" data-i18n="regp_username">Username:</label>
                    <input required class="form-control" name="username" id="username" type="text">
                </div>

                <div class="form-group">
                    <label for="email" data-i18n="regp_email">Email:</label>
                    <input required class="form-control" name="email" id="email" type="email">
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="regp_password">Password:</label>
                    <input required class="form-control" name="password" id="password" type="password">
                </div>

                <div class="form-group">
                    <label for="confrim-password" data-i18n="regp_confirm_password">Confirm Password:</label>
                    <input required class="form-control" name="confrim-password" id="confrim-password" type="password">
                </div>

                <div class="button-wrapper">
                    <button type="submit" class="btn" data-i18n="regp_submit">Submit</button>
                </div>
            </form>
        </div>

    </div>

    <!-- Language Change Script --> 
    <script src="js/i18n.js"></script>
</body>

</html>
