<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="css/login_page.css">
  <link rel="icon" type="image/png" size="32x32" href="../logo/favicon-32.png">
</head>

<body>
    <a href="../index.html" class="back-home" data-i18n="logp_back_btn">← Back to Home</a>
    <div class="card">
        <div class="card-header">
            <a href="../index.html" class="logo-link">
                <img src="../logo/white.png" alt="Fitness App Logo">
            </a>
            <div class="text-header" data-i18n="logp_title">Login</div>
        </div>

        <div class="card-body">
            <form id="login-form" action="#">
                <div class="form-group">
                    <label for="email" data-i18n="logp_email">Email:</label>
                    <input required class="form-control" name="email" id="email" type="email">
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="logp_password">Password:</label>
                    <input required class="form-control" name="password" id="password" type="password">
                </div>

                <div class="button-wrapper">
                    <button type="submit" class="btn" data-i18n="logp_login_btn">Login</button>
                </div>
            </form>
        </div>

    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();

            var form = e.target;
            var email = form.email.value.trim();
            var password = form.password.value;
            var btn = form.querySelector('.btn');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            var body = new URLSearchParams();
            body.append('email', email);
            body.append('password', password);

            fetch('/api/login', {
                method: 'POST',
                body: body
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('uid', data.user.id);
                    localStorage.setItem('username', data.user.username);
                    localStorage.setItem('email', data.user.email);
                    localStorage.setItem('isLoggedIn', 'true');

                    window.location.href = 'home_page.html';
                } else {
                    alert(data.message || 'Login failed');
                    btn.disabled = false;
                    btn.textContent = 'Login';
                }
            })
            .catch(function(err) {
                console.error('Login error:', err);
                alert('Could not connect to server');
                btn.disabled = false;
                btn.textContent = 'Login';
            });
        });
    </script>

    <!-- Language Change Script --> 
    <script src="js/i18n.js"></script>
</body>

</html>
