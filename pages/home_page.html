<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Fitness App</title>
  <link rel="stylesheet" href="home_page.css">
</head>

<body>
  <nav class="top-nav">
    <a href="#" class="nav-logo">LOGO</a>
    <div class="nav-links">
      <a href="#" class="nav-link" data-i18n="myPlan">My Plan</a>
      <a href="#" class="nav-link" data-i18n="records">Records</a>
      <a href="#" class="nav-link" data-i18n="start">Start</a>
    </div>
    <div class="nav-right">
      <div class="lang-dropdown">
        <button class="nav-icon lang-btn" aria-label="Language">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </button>
        <div class="lang-menu">
          <button class="lang-option" data-lang="en">English</button>
          <button class="lang-option" data-lang="zh">中文</button>
          <button class="lang-option" data-lang="ja">日本語</button>
          <button class="lang-option" data-lang="ko">한국어</button>
          <button class="lang-option" data-lang="es">Español</button>
          <button class="lang-option" data-lang="fr">Français</button>
          <button class="lang-option" data-lang="de">Deutsch</button>
          <button class="lang-option" data-lang="pt">Português</button>
        </div>
      </div>
      <a href="#" class="nav-icon" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
      </a>
    </div>
  </nav>

  <main class="content">
    <div class="hero">
      <h1 class="hero-title" data-i18n="heroTitle">Train Smarter</h1>
      <p class="hero-subtitle" data-i18n="heroSubtitle">Your fitness journey starts here.</p>
      <a href="#" class="hero-cta" data-i18n="getStarted">Get Started</a>
    </div>
  </main>
  <script src="translations.js"></script>
  <script>
    function setLanguage(lang) {
      const t = translations[lang] || translations.en;
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelector('.lang-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      document.querySelector('.lang-menu').classList.toggle('show');
    });
    document.querySelectorAll('.lang-option').forEach(function(btn) {
      btn.addEventListener('click', function() {
        setLanguage(this.getAttribute('data-lang'));
        document.querySelector('.lang-menu').classList.remove('show');
      });
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.lang-dropdown')) {
        document.querySelector('.lang-menu').classList.remove('show');
      }
    });
    setLanguage(localStorage.getItem('lang') || 'en');
  </script>
</body>

</html>
