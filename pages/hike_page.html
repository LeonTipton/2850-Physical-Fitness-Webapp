<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiking Activity - Fitness App</title>
  <link rel="stylesheet" href="css/hike_page.css">
</head>

<body>
  <div class="page-bg" id="page-bg"></div>
  <div class="page-overlay"></div>

  <nav class="top-nav">
    <a href="start_page.html" class="nav-back">
      <svg class="nav-back-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back
    </a>
    <a href="home_page.html" class="nav-logo">LOGO</a>
    <div class="nav-right">
      <a href="#" class="nav-icon" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </a>
      <a href="#" class="nav-icon" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
      </a>
    </div>
  </nav>

  <main class="hike-main">
    <!-- Page Header -->
    <header class="hike-header card-animate">
      <h1 class="hike-title">Hiking Activity</h1>
      <p class="hike-subtitle">Track your outdoor journey</p>
    </header>

    <div class="hike-layout">
      <!-- Main Form -->
      <section class="hike-form-card card-animate">
        <div class="form-header">
          <h2 class="form-title">New Hike</h2>
          <div class="hike-goal">
            <span class="goal-label">This week</span>
            <span class="goal-value" id="goal-progress">12 km / 20 km</span>
            <div class="goal-bar"><div class="goal-fill" id="goal-fill" style="width: 60%"></div></div>
          </div>
        </div>

        <!-- Live Timer (hidden in idle state) -->
        <div id="timer-display" class="timer-display hidden">
          <div id="timer-status" class="timer-status">Running</div>
          <div id="timer-clock" class="timer-clock">00:00</div>
          <div class="timer-hint">Duration is updated automatically</div>
        </div>

        <form class="hike-form" id="hike-form">
          <div class="form-row">
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>Distance (km)</label>
              <input id="hike-distance" type="number" step="0.1" min="0" placeholder="0.0">
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>Duration (min)</label>
              <input id="hike-duration" type="number" min="0" placeholder="0" readonly>
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span>Calories</label>
              <input id="hike-calories" type="number" min="0" placeholder="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M4 8l4 4 4-4 4 4M4 16l4 4 4-4 4 4"/></svg></span>Steps</label>
              <input id="hike-steps" type="number" min="0" placeholder="0">
            </div>
            <div class="form-group">
              <label>Avg. pace (min/km)</label>
              <input id="hike-pace" type="text" readonly placeholder="--:--">
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 22 22 22"/></svg></span>Elevation gain (m)</label>
              <input id="hike-elevation" type="number" min="0" placeholder="0">
            </div>
          </div>
          <div class="form-row form-row-2">
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>Location</label>
              <input id="hike-location" type="text" placeholder="Trail or park name">
            </div>
            <div class="form-group">
              <label>Terrain type</label>
              <select id="hike-terrain">
                <option value="">Select terrain</option>
                <option>Flat</option>
                <option>Rolling</option>
                <option>Mountain</option>
                <option>Rocky</option>
                <option>Forest</option>
              </select>
            </div>
          </div>
          <div class="form-row form-row-2">
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>Weather</label>
              <select id="hike-weather">
                <option value="">Select weather</option>
                <option>Sunny</option>
                <option>Cloudy</option>
                <option>Rainy</option>
                <option>Snowy</option>
              </select>
            </div>
            <div class="form-group">
              <label><span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>Difficulty</label>
              <select id="hike-difficulty">
                <option value="">Select difficulty</option>
                <option>Easy</option>
                <option>Moderate</option>
                <option>Hard</option>
                <option>Expert</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Notes</label>
            <textarea id="hike-notes" rows="3" placeholder="Add notes about your hike..."></textarea>
          </div>
        </form>

        <!-- Action Buttons -->
        <div class="hike-actions">
          <button id="btn-start"  class="btn-primary">Start Hike</button>
          <button id="btn-pause"  class="btn-secondary" disabled>Pause</button>
          <button id="btn-finish" class="btn-secondary" disabled>Finish</button>
          <button id="btn-save"   class="btn-outline"   disabled>Save Hike</button>
        </div>
      </section>

      <!-- Sidebar -->
      <aside class="hike-sidebar">
        <!-- Summary Card (populated from localStorage) -->
        <div class="summary-card card-animate card-animate-delay-1">
          <h3 class="summary-title">Your Stats</h3>
          <div class="summary-grid">
            <div class="summary-item summary-item-1">
              <span class="summary-value" id="stat-total-hikes">—</span>
              <span class="summary-label">Total Hikes</span>
            </div>
            <div class="summary-item summary-item-2">
              <span class="summary-value" id="stat-total-distance">—</span>
              <span class="summary-label">Total Distance</span>
            </div>
            <div class="summary-item summary-item-3">
              <span class="summary-value" id="stat-max-elevation">—</span>
              <span class="summary-label">Best Elevation</span>
            </div>
            <div class="summary-item summary-item-4">
              <span class="summary-value" id="stat-longest">—</span>
              <span class="summary-label">Longest Hike</span>
            </div>
          </div>
        </div>

        <!-- Recent Hikes (populated from localStorage) -->
        <div class="recent-card card-animate card-animate-delay-2">
          <h3 class="recent-title">Recent Hikes</h3>
          <ul class="recent-list" id="recent-list">
            <li class="recent-empty">No hikes saved yet.</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>

  <!-- Save success notification -->
  <div id="save-notification" class="save-notif" role="status" aria-live="polite">
    <span class="save-notif-icon">✓</span>
    <div>
      <div class="save-notif-title">Hike Saved!</div>
      <div class="save-notif-sub">Record stored. <a href="records_page.html">View Records →</a></div>
    </div>
  </div>

  <script src="js/activity-store.js"></script>
  <script>
  (function () {
    // ── DOM refs ──────────────────────────────────────────────────────────
    var btnStart    = document.getElementById('btn-start');
    var btnPause    = document.getElementById('btn-pause');
    var btnFinish   = document.getElementById('btn-finish');
    var btnSave     = document.getElementById('btn-save');
    var timerDisplay = document.getElementById('timer-display');
    var timerClock  = document.getElementById('timer-clock');
    var timerStatus = document.getElementById('timer-status');
    var saveNotif   = document.getElementById('save-notification');

    var distanceInput  = document.getElementById('hike-distance');
    var durationInput  = document.getElementById('hike-duration');
    var paceInput      = document.getElementById('hike-pace');
    var caloriesInput  = document.getElementById('hike-calories');
    var stepsInput     = document.getElementById('hike-steps');
    var elevationInput = document.getElementById('hike-elevation');
    var locationInput  = document.getElementById('hike-location');
    var terrainSelect  = document.getElementById('hike-terrain');
    var weatherSelect  = document.getElementById('hike-weather');
    var difficultySelect = document.getElementById('hike-difficulty');
    var notesArea      = document.getElementById('hike-notes');

    // ── State ─────────────────────────────────────────────────────────────
    // 'idle' | 'running' | 'paused' | 'finished'
    var state          = 'idle';
    var timerInterval  = null;
    var elapsedSeconds = 0;
    var startTimestamp = null;  // Date.now() adjusted for pauses
    var startDate      = null;  // Date object when hike began

    // ── Timer helpers ─────────────────────────────────────────────────────
    function pad(n) { return String(n).padStart(2, '0'); }

    function formatClock(s) {
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      return h > 0
        ? pad(h) + ':' + pad(m) + ':' + pad(sec)
        : pad(m) + ':' + pad(sec);
    }

    function formatDuration(s) {
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      if (h > 0) return h + ' h ' + m + ' min';
      return (m || 1) + ' min';
    }

    function updateTimerDisplay() {
      timerClock.textContent = formatClock(elapsedSeconds);
      // Keep the duration field in sync (read-only, for user reference)
      var mins = Math.round(elapsedSeconds / 60);
      if (mins >= 1) durationInput.value = mins;
      updatePace();
    }

    function tickTimer() {
      elapsedSeconds = Math.floor((Date.now() - startTimestamp) / 1000);
      updateTimerDisplay();
    }

    function startTicking() {
      startTimestamp = Date.now() - elapsedSeconds * 1000;
      timerInterval  = setInterval(tickTimer, 1000);
    }

    function stopTicking() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    // ── Pace calculation ──────────────────────────────────────────────────
    function updatePace() {
      var dist = parseFloat(distanceInput.value);
      var mins = elapsedSeconds > 0
        ? elapsedSeconds / 60
        : parseFloat(durationInput.value);
      if (!dist || !mins || dist <= 0 || mins <= 0) {
        paceInput.value = '';
        return;
      }
      var paceMin = mins / dist;
      var totalSec = Math.round(paceMin * 60);
      paceInput.value = Math.floor(totalSec / 60) + ':' + pad(totalSec % 60);
    }

    distanceInput.addEventListener('input', updatePace);

    // ── State machine ─────────────────────────────────────────────────────
    function setState(newState) {
      state = newState;

      // Timer display visibility
      timerDisplay.classList.toggle('hidden', state === 'idle');
      timerDisplay.classList.toggle('timer-running',  state === 'running');
      timerDisplay.classList.toggle('timer-paused',   state === 'paused');
      timerDisplay.classList.toggle('timer-finished', state === 'finished');

      switch (state) {
        case 'idle':
          btnStart.textContent = 'Start Hike';
          btnStart.disabled  = false;
          btnPause.disabled  = true;
          btnFinish.disabled = true;
          btnSave.disabled   = true;
          timerStatus.textContent = '';
          elapsedSeconds = 0;
          durationInput.value = '';
          timerClock.textContent = '00:00';
          break;

        case 'running':
          btnStart.textContent = 'Running…';
          btnStart.disabled  = true;
          btnPause.textContent = 'Pause';
          btnPause.disabled  = false;
          btnFinish.disabled = false;
          btnSave.disabled   = true;
          timerStatus.textContent = '● Running';
          timerDisplay.querySelector('.timer-hint').textContent =
            'Duration is updated automatically';
          break;

        case 'paused':
          btnStart.textContent = 'Resume';
          btnStart.disabled  = false;
          btnPause.disabled  = true;
          btnFinish.disabled = false;
          btnSave.disabled   = true;
          timerStatus.textContent = '⏸ Paused';
          timerDisplay.querySelector('.timer-hint').textContent =
            'Timer paused — click Resume to continue';
          break;

        case 'finished':
          btnStart.textContent = 'Start Hike';
          btnStart.disabled  = true;
          btnPause.disabled  = true;
          btnFinish.disabled = true;
          btnSave.disabled   = false;
          timerStatus.textContent = '✓ Finished';
          timerDisplay.querySelector('.timer-hint').textContent =
            'Review your data below, then click Save Hike';
          break;
      }
    }

    // ── Button handlers ───────────────────────────────────────────────────
    btnStart.addEventListener('click', function () {
      if (state === 'idle') {
        startDate = new Date();
        startTicking();
        setState('running');
      } else if (state === 'paused') {
        startTicking();
        setState('running');
      }
    });

    btnPause.addEventListener('click', function () {
      if (state === 'running') {
        stopTicking();
        setState('paused');
      }
    });

    btnFinish.addEventListener('click', function () {
      stopTicking();
      setState('finished');
      updateTimerDisplay();
    });

    btnSave.addEventListener('click', saveHike);

    // ── Save ──────────────────────────────────────────────────────────────
    function saveHike() {
      var distance  = parseFloat(distanceInput.value)  || 0;
      var elevation = parseFloat(elevationInput.value) || 0;
      var calories  = parseInt(caloriesInput.value, 10) || 0;
      var location  = (locationInput.value || '').trim() || 'My Hike';

      var dateObj       = startDate || new Date();
      var dateFormatted = dateObj.toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric'
      });
      var dateISO = dateObj.toISOString().slice(0, 10);

      var details = [];
      if (distance  > 0) details.push({ icon: 'distance',  text: distance.toFixed(1) + ' km' });
      if (elevation > 0) details.push({ icon: 'elevation', text: '↑ ' + elevation + ' m' });
      if (calories  > 0) details.push({ icon: 'cal',       text: calories + ' kcal' });
      if (details.length === 0) details.push({ icon: 'distance', text: '—' });

      var record = {
        id:              String(Date.now()),
        type:            'hike',
        label:           'Hike',
        emoji:           '🥾',
        date:            dateFormatted,
        dateISO:         dateISO,
        duration:        formatDuration(elapsedSeconds),
        durationSeconds: elapsedSeconds,
        badge:           location,
        details:         details,
        // raw fields for future use
        distanceKm:      distance,
        elevationM:      elevation,
        calories:        calories,
        location:        location,
        terrain:         terrainSelect.value,
        weather:         weatherSelect.value,
        difficulty:      difficultySelect.value,
        notes:           notesArea.value.trim()
      };

      ActivityStore.add(record);
      refreshSidebar();
      showNotification();
    }

    // ── Notification + reset ──────────────────────────────────────────────
    function showNotification() {
      saveNotif.classList.add('save-notif--visible');
      setTimeout(function () {
        saveNotif.classList.remove('save-notif--visible');
        resetForm();
      }, 3000);
    }

    function resetForm() {
      stopTicking();
      setState('idle');
      distanceInput.value  = '';
      paceInput.value      = '';
      caloriesInput.value  = '';
      stepsInput.value     = '';
      elevationInput.value = '';
      locationInput.value  = '';
      notesArea.value      = '';
      terrainSelect.value    = '';
      weatherSelect.value    = '';
      difficultySelect.value = '';
      startDate = null;
    }

    // ── Sidebar stats from localStorage ──────────────────────────────────
    function refreshSidebar() {
      var hikes = ActivityStore.getAll().filter(function (r) {
        return r.type === 'hike';
      });

      var totalCount    = hikes.length;
      var totalDistKm   = hikes.reduce(function (s, r) { return s + (r.distanceKm || 0); }, 0);
      var maxElev       = hikes.reduce(function (s, r) { return Math.max(s, r.elevationM || 0); }, 0);
      var longestDistKm = hikes.reduce(function (s, r) { return Math.max(s, r.distanceKm || 0); }, 0);

      document.getElementById('stat-total-hikes').textContent =
        totalCount > 0 ? totalCount : '—';
      document.getElementById('stat-total-distance').textContent =
        totalDistKm > 0 ? totalDistKm.toFixed(1) + ' km' : '—';
      document.getElementById('stat-max-elevation').textContent =
        maxElev > 0 ? maxElev + ' m' : '—';
      document.getElementById('stat-longest').textContent =
        longestDistKm > 0 ? longestDistKm.toFixed(1) + ' km' : '—';

      var list = document.getElementById('recent-list');
      if (hikes.length === 0) {
        list.innerHTML = '<li class="recent-empty">No hikes saved yet.</li>';
        return;
      }

      list.innerHTML = hikes.slice(0, 5).map(function (r) {
        return '<li class="recent-item">'
          + '<div class="recent-info">'
          +   '<span class="recent-location">' + escHtml(r.badge) + '</span>'
          +   '<span class="recent-date">'     + escHtml(r.date)  + '</span>'
          + '</div>'
          + '<span class="recent-distance">'
          +   (r.distanceKm > 0 ? r.distanceKm.toFixed(1) + ' km' : r.duration)
          + '</span>'
          + '</li>';
      }).join('');
    }

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ──────────────────────────────────────────────────────────────
    refreshSidebar();
  })();
  </script>

  <!-- Language Change Script --> 
  <script src="js/i18n.js"></script>
</body>

</html>
