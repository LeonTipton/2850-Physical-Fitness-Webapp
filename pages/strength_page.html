<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Strength Exercise - Fitness App</title>
  <link rel="stylesheet" href="css/strength_page.css">
</head>

<body>
  <div class="page-bg"></div>
  <div class="page-overlay"></div>

  <nav class="top-nav">
    <a href="activity_page.html?activity=weight" class="nav-back">
      <svg class="nav-back-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span data-i18n="back">Back</span>
    </a>
    <a href="home_page.html" class="nav-logo">LOGO</a>
    <div class="nav-right">
      <a href="setting_page.html" class="nav-icon" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </a>
      <a href="profile_page.html" class="nav-icon" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
      </a>
    </div>
  </nav>

  <main class="strength-main">
    <header class="strength-header card-animate">
      <h1 class="strength-title" data-i18n="strp_title">Choose Strength Exercise</h1>
      <p class="strength-subtitle" id="strength-subtitle" data-i18n="strp_subtitle">Select a muscle group to view exercises</p>
    </header>

    <div class="strength-content card-animate card-animate-delay-1">
      <!-- View 1: Category Cards -->
      <div class="view-categories" id="view-categories">
        <div class="category-grid" id="category-grid">
          <button type="button" class="category-card" data-category="chest" data-i18n="strp_chest">Chest</button>
          <button type="button" class="category-card" data-category="back" data-i18n="strp_back">Back</button>
          <button type="button" class="category-card" data-category="legs" data-i18n="strp_legs">Legs</button>
          <button type="button" class="category-card" data-category="shoulders"data-i18n="strp_shoulders">Shoulders</button>
          <button type="button" class="category-card" data-category="arms" data-i18n="strp_arms">Arms</button>
          <button type="button" class="category-card" data-category="core" data-i18n="strp_core">Core</button>
        </div>
      </div>

      <!-- View 2: Exercise List -->
      <div class="view-exercises hidden" id="view-exercises">
        <button type="button" class="back-btn" id="back-to-categories" data-i18n="strp_back_btn">← Back to categories</button>
        <h2 class="exercise-list-title" id="exercise-list-title">Chest</h2>
        <div class="exercise-grid" id="exercise-grid"></div>
      </div>
    </div>
  </main>

  <script>
  (function () {
    const exercises = {
      chest: ['ex_bench_press', 'ex_incline_bench_press', 'ex_chest_press_machine', 'ex_push_up'],
      back: ['ex_lat_pulldown', 'ex_seated_row', 'ex_pull_up', 'ex_deadlift'],
      legs: ['ex_squat', 'ex_leg_press', 'ex_leg_extension', 'ex_leg_curl'],
      shoulders: ['ex_shoulder_press', 'ex_lateral_raise', 'ex_front_raise'],
      arms: ['ex_bicep_curl', 'ex_hammer_curl', 'ex_tricep_pushdown', 'ex_tricep_dip'],
      core: ['ex_plank', 'ex_crunch', 'ex_russian_twist', 'ex_leg_raise']
    };

    const categoryLabels = {
      chest: 'strp_chest',
      back: 'strp_back',
      legs: 'strp_legs',
      shoulders: 'strp_shoulders',
      arms: 'strp_arms',
      core: 'strp_core'
    };

    const viewCategories = document.getElementById('view-categories');
    const viewExercises = document.getElementById('view-exercises');
    const categoryGrid = document.getElementById('category-grid');
    const exerciseGrid = document.getElementById('exercise-grid');
    const exerciseListTitle = document.getElementById('exercise-list-title');
    const strengthSubtitle = document.getElementById('strength-subtitle');
    const backToCategories = document.getElementById('back-to-categories');

    function show(el) {
      el.classList.remove('hidden');
    }

    function hide(el) {
      el.classList.add('hidden');
    }

    /* JavaScript dynamic content translation */
    function t(key) {
      const lang = getSavedLanguage();
      const safeLang = translations[lang] ? lang : "en";
      return translations[safeLang][key] || key;
    }

    categoryGrid.querySelectorAll('.category-card').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const category = btn.dataset.category;
        const list = exercises[category];

        exerciseListTitle.textContent = t(categoryLabels[category]);
        strengthSubtitle.textContent = t('strp_select_exercise');
        exerciseGrid.innerHTML = '';

        list.forEach(function (exerciseKey) {
          const a = document.createElement('a');
          const exerciseName = t(exerciseKey);
          const categoryName = t(categoryLabels[category]);

          a.href =
            'strength_workout_page.html?exercise=' +
            encodeURIComponent(exerciseName) +
            '&category=' +
            encodeURIComponent(categoryName);

          a.className = 'exercise-card';
          a.textContent = exerciseName;
          exerciseGrid.appendChild(a);
        });

        hide(viewCategories);
        show(viewExercises);
      });
    });

    backToCategories.addEventListener('click', function () {
      strengthSubtitle.textContent = t('strp_subtitle');
      hide(viewExercises);
      show(viewCategories);
    });
  })();
  </script>

  <!-- Language Change Script --> 
  <script src="js/i18n.js"></script>
</body>

</html>
