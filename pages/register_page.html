<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Page</title>
  <link rel="stylesheet" href="register_page.css">
</head>


<body>
    <a href="../index.html" class="back-home">← Back to Home</a>
    <div class="card">
        <div class="card-header">
            <a href="../index.html" class="logo-link">
                <div class="logo-mini">LOGO</div>
            </a>
            <div class="text-header">Register</div>
        </div>

        <div class="card-body">
            <form action="#">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input required class="form-control" name="username" id="username" type="text">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input required class="form-control" name="email" id="email" type="email">
                </div>

                <div class="form-group">
                    <lable for="password">Password:</lable>
                    <input required class="form-control" name="password" id="password" type="password">
                </div>

                <div class="form-group">
                    <label for="confrim-password">Confirm Password:</label>
                    <input required class="form-control" name="confrim-password" id="confrim-password" type="password">
                </div>

                <div class="button-wrapper">
                    <input type="submit" class="btn" value="Submit">
                </div>
            </form>
        </div>

    </div>
</body>

</html>
