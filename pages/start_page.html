<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start - Fitness App</title>
  <link rel="stylesheet" href="css/start_page.css">
</head>

<body>
  <div class="page-bg"></div>
  <div class="page-overlay"></div>
  <div class="page-bg-hover" id="page-bg-hover"></div>

  <nav class="top-nav">
    <a href="home_page.html" class="nav-back">
      <svg class="nav-back-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back
    </a>
    <a href="home_page.html" class="nav-logo">LOGO</a>
    <div class="nav-right">
      <a href="#" class="nav-icon" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </a>
      <a href="#" class="nav-icon" aria-label="Profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
      </svg>
    </a>
    </div>
  </nav>

  <main class="content">
    <div class="main-card">
      <h1 class="page-title">What are we doing today?</h1>
      <div class="activity-grid">
        <a href="activity_page.html?activity=hike" class="activity-btn"><span class="activity-emoji">🥾</span> Hike</a>
        <a href="activity_page.html?activity=run" class="activity-btn" data-activity="run"><span class="activity-emoji">🏃</span> Run</a>
        <a href="activity_page.html?activity=swim" class="activity-btn"><span class="activity-emoji">🏊</span> Swim</a>
        <a href="activity_page.html?activity=cycle" class="activity-btn"><span class="activity-emoji">🚴</span> Cycle</a>
        <a href="activity_page.html?activity=gym" class="activity-btn"><span class="activity-emoji">🏋️</span> Gym</a>
        <a href="activity_page.html?activity=weight" class="activity-btn"><span class="activity-emoji">💪</span> Strength</a>
      </div>
    </div>
  </main>

  <script>
    const bgImages = {
      run: 'url(https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=1920)',
      cycle: 'url(https://images.unsplash.com/photo-1541625602330-2277a4c46182?w=1920)',
      swim: 'url(https://images.unsplash.com/photo-1530549387789-4c1017266635?w=1920)',
      gym: 'url(https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1920)',
      hike: 'url(https://images.unsplash.com/photo-1551632811-561732d1e306?w=1920)',
      weight: 'url(https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=1920)'
    };

    const hoverEl = document.getElementById('page-bg-hover');
    const buttons = document.querySelectorAll('.activity-btn');

    buttons.forEach(function(btn) {
      const activity =
        btn.dataset.activity ||
        btn.getAttribute('href').match(/activity=(\w+)/)?.[1];
      if (!activity || !bgImages[activity]) return;

      btn.addEventListener('mouseenter', function() {
        hoverEl.style.backgroundImage = bgImages[activity];
        hoverEl.classList.add('active');
      });

      btn.addEventListener('mouseleave', function() {
        hoverEl.classList.remove('active');
      });
    });
  </script>
  
  <!-- Language Change Script --> 
  <script src="js/i18n.js"></script>
</body>

</html>
